name: Viikko-ohjelman päivitys (kokeellinen)
on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python fetch_week.py
      - run: |
          git config user.name 'PJ update'
          git config user.email 'actions@users.noreply.github.com'
          git add data
          git diff --cached --quiet || (git commit -m 'Update public weekly programme' && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
