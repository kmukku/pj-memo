name: Viikko-ohjelman päivitys

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
      timezone: 'Europe/Helsinki'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Asenna riippuvuudet
        run: pip install requests beautifulsoup4

      - name: Hae viikon ohjelma
        run: python fetch_week.py

      - name: Tallenna ohjelma
        run: |
          git config user.name 'PJ update'
          git config user.email 'actions@users.noreply.github.com'
          git add data
          git diff --cached --quiet || (git commit -m 'Update public weekly programme' && git push)

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: .

  deploy:
    needs: fetch
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
